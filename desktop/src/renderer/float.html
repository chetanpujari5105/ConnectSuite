<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The same CSP the main page runs under. A second entry point is a second place to get this
         wrong, and a window with a laxer policy than the app it belongs to is worse than no policy
         at all — it is the one an attacker would aim at. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'" />
    <title>Phone screen</title>
    <!-- tokens.css first, exactly as index.html does: this window is a second view of the same
         design system, not a place with colours of its own. All three sheets are in the
         copy-assets array — a stylesheet missing from it builds clean and ships unstyled. -->
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="float.css" />
  </head>
  <body class="float-body">
    <!--
      Handoff §3: "Contains only the title bar and the phone screen — no sidebar, dashboard,
      inspector cards, dock, or tool rail."

      **The control strip is a departure from that sentence, taken deliberately.** The handoff's
      hover dock was built and shipped and then measured: invisible at rest, over the picture, and on
      top of Android's own nav bar. A window whose purpose is to be watched while another app has
      focus cannot put its controls behind a hover. Defect 115, row M16 in docs/design-departures.md.
      Defect 118 then moved it from the right edge to the bottom, so the window reads like a phone
      with a nav bar under the screen rather than a phone with a toolbar bolted to its side.
    -->
    <div class="float-frame" id="float-frame">
      <!-- 34px, and that 34 is TITLE in shared/floatGeometry.ts. The two must agree: the window's
           height is `width * ratio + TITLE + BOTTOM_BAR`, so a title bar that is not 34 tall makes the
           phone screen the wrong aspect and no amount of CSS below fixes it. The ratio is the
           phone's, read from the capture it announces — not 19.5:9, which is only the default before
           it has said anything. Defect 114. -->
      <header class="float-title" id="float-title">
        <div class="lights">
          <button type="button" class="light close" id="float-close" aria-label="Close the floating window" title="Close the floating window"></button>
          <button type="button" class="light min" id="float-minimize" aria-label="Minimise the floating window" title="Minimise"></button>
          <!-- Green is smart-fit, not full screen. A ratio-locked window has no full screen to go
               to, and the handoff binds the green light to the same 300pt default a double-click
               on the bar goes to. -->
          <button type="button" class="light zoom" id="float-smart-fit" aria-label="Fit the window back to its default size" title="Fit to default size"></button>
        </div>

        <div class="float-device">
          <span class="live-dot" id="float-dot" aria-hidden="true"></span>
          <span class="mono" id="float-device-name">Phone</span>
        </div>

        <button type="button" class="pin" id="float-pin" aria-pressed="false" aria-label="Keep this window in front of other apps" title="Keep in front">
          <span class="pin-glyph" aria-hidden="true"></span>
        </button>
      </header>

      <div class="float-screen" id="float-screen">
        <canvas id="float-canvas" aria-label="The phone's screen"></canvas>

        <!--
          The same overlay/notice rule the Mirror pane established, for the same reason: this means
          "there is no picture, here is why", and any painted frame takes it down. It is not a place
          for a refusal that happens while frames are flowing — that would be wiped inside one frame
          at 60fps. See docs/testing.md, defect 23.
        -->
        <div class="float-overlay" id="float-overlay">
          <p class="float-reason" id="float-reason">Waiting for the phone's next keyframe…</p>
        </div>

      </div>

      <!--
        The control bar. **Not an overlay** — it is `BOTTOM_BAR` points of the window's HEIGHT, taken
        below the picture in shared/floatGeometry.ts exactly as the 34px title bar is taken above it,
        so nothing here covers a part of the phone's screen the canvas would otherwise accept a tap
        on. Defect 115 made it permanent; **defect 118 moved it from the right edge to the bottom**,
        which is the shape Android's own navigation bar has.

        Filled from FLOAT_RAIL in floatRail.ts rather than written out, so the icon names are inside
        the enumeration floatRail.test.ts asserts over — the empty-ring defect — and so the tooltip
        text has exactly one home.

        The tooltip lives here rather than inside the bar because a bar 40px tall cannot contain one.
        It is `pointer-events: none`, so it can never block the control it describes.
      -->
      <nav class="float-bar" id="float-bar" aria-label="Phone controls"></nav>
      <div class="float-tip" id="float-tip" role="tooltip" hidden></div>
    </div>

    <!-- Width is the only input this handle produces; height and Y follow inside resolveBounds.
         Outside .float-frame's flex row so it can sit on the window's own corner, over the rail. -->
    <div class="float-resize" id="float-resize" role="separator" aria-label="Resize the floating window" title="Drag to resize"></div>

    <div class="float-toast" id="float-toast" role="status" aria-live="polite"></div>

    <script src="../shared/appearance.js"></script>
    <script src="icons.js"></script>
    <script src="floatRail.js"></script>
    <script src="captureFit.js"></script>
    <script src="pointerGestures.js"></script>
    <script src="wheelPump.js"></script>
    <script src="streamStart.js"></script>
    <script src="floatWait.js"></script>
    <script src="h264Canvas.js"></script>
    <script src="float.js"></script>
  </body>
</html>
