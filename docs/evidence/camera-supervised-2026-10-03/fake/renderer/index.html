<!doctype html>
<html><head><meta charset="utf-8"><title>FAKE camera pane (local actor tests)</title></head>
<body>
<nav><a data-nav="overview">Overview</a><a data-nav="camera">Camera</a></nav>
<section data-screen="overview" hidden></section>
<section data-screen="camera">
  <div class="camera-stage" hidden><canvas width="320" height="240"></canvas></div>
  <div class="camera-controls"></div>
</section>
<script>
// A stand-in for the Camera pane: the same classes, labels and `camera.state` shape the driver and the
// actor read. Scenario timelines start on window.__go(). Every click is logged with its time and the
// state it landed on.
var scenario = new URLSearchParams(location.search).get('s') || 'normal';
window.__log = [];
function log(what, extra) { __log.push(Object.assign({ at: Date.now(), what: what, kind: camera.state.kind, streamId: camera.state.streamId || null }, extra || {})); }
var section = document.querySelector('section[data-screen="camera"]');
var stage = section.querySelector('.camera-stage');
var canvas = section.querySelector('canvas');
var controls = section.querySelector('.camera-controls');
var drawTimer = null;
var Y = 'aaaaaaaa' + '1111111122222222' + '33333333', OLD = 'bbbbbbbb' + '0000000000000000' + '00000000', Z = 'cccccccc' + '4444444455555555' + '66666666';
var camera = { state: { kind: 'idle' }, painter: { paint: function(){}, draw: function(){} } };
function set(state) { camera.state = state; log('state:' + state.kind); render(); }
function btn(label, cls, onClick) { var b = document.createElement('button'); b.className = cls; b.textContent = label; b.addEventListener('click', onClick); controls.appendChild(b); }
function render() {
  controls.replaceChildren();
  var s = camera.state;
  var live = s.kind === 'live';
  stage.hidden = !live;
  if (drawTimer) { clearInterval(drawTimer); drawTimer = null; }
  var ctx = canvas.getContext('2d');
  if (live) drawTimer = setInterval(function(){ ctx.fillStyle = s.facing === 'front' ? '#4a8' : '#a84'; ctx.fillRect(0, 0, 320, 240); }, 66);
  else ctx.clearRect(0, 0, 320, 240);
  if (s.kind === 'idle' || s.kind === 'ended') btn(s.kind === 'idle' ? 'Ask phone for camera' : 'Ask again', 'button primary-action camera-request', function(){ log('CLICK request'); request(); });
  if (s.kind === 'requesting' || s.kind === 'connecting') btn('Cancel request', 'button camera-cancel', function(){ log('CLICK cancel'); set({ kind: 'ended', streamId: s.streamId, reason: 'stopped-by-mac' }); });
  if (live) {
    var to = s.facing === 'back' ? 'front' : 'back';
    btn('Switch to ' + to + ' camera', 'button camera-switch', function(){ log('CLICK switch', { to: to }); var id = s.streamId; setTimeout(function(){ if (camera.state.kind === 'live' && camera.state.streamId === id) set(Object.assign({}, camera.state, { facing: to })); }, 400); });
    btn('Stop camera', 'button danger camera-stop', function(){ log('CLICK stop'); set({ kind: 'ended', streamId: s.streamId, reason: 'stopped-by-mac' }); });
  }
}
var T = [];
function at(ms, fn) { T.push(setTimeout(fn, ms)); }
function goLive(id, t0) { at(t0, function(){ set({ kind: 'requesting', streamId: id, facing: 'back' }); }); at(t0 + 1000, function(){ set({ kind: 'connecting', streamId: id, facing: 'back' }); }); at(t0 + 1500, function(){ set({ kind: 'live', streamId: id, facing: 'back', framesReceived: 1, stalled: false }); }); }
function request() {
  // Only the driver-in-the-loop scenarios start on a request press; the others start on __go().
  if (scenario.indexOf('cap') === 0) { set({ kind: 'requesting', streamId: null, facing: 'back' }); goLive(Y, 300); }
}
// Initial states for the stale/pending scenarios.
if (scenario === 'stale') camera.state = { kind: 'ended', streamId: OLD, reason: 'stopped-by-mac' };
if (scenario === 'startLive') camera.state = { kind: 'live', streamId: OLD, facing: 'back', framesReceived: 9, stalled: false };
if (scenario === 'startRequesting') camera.state = { kind: 'requesting', streamId: OLD, facing: 'back' };
render();
window.__go = function () {
  log('go');
  if (scenario === 'normal' || scenario === 'stale') goLive(Y, 300);
  if (scenario === 'startLive' || scenario === 'startRequesting') goLive(Y, 300);
  if (scenario === 'endedEarly') { goLive(Y, 300); at(3000, function(){ set({ kind: 'ended', streamId: Y, reason: 'stopped-on-phone' }); }); }
  if (scenario === 'replaced') { goLive(Y, 300); at(9000, function(){ set({ kind: 'live', streamId: Z, facing: 'back', framesReceived: 1, stalled: false }); }); }
  if (scenario === 'pendingExpire') { at(300, function(){ set({ kind: 'requesting', streamId: Y, facing: 'back' }); }); at(3000, function(){ set({ kind: 'ended', streamId: Y, reason: 'expired' }); }); }
  if (scenario === 'pendingForever') { at(300, function(){ set({ kind: 'requesting', streamId: Y, facing: 'back' }); }); }
  return 'go ' + scenario;
};
</script>
</body></html>
